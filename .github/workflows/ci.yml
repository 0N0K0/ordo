name: CI
run-name: CI ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - main
      - prod

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, migrations, build
    runs-on: ubuntu-latest
    # The PostgreSQL of o2switch: migrations must apply on it.
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_USER: ordo
          POSTGRES_PASSWORD: ordo
          POSTGRES_DB: ordo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ordo:ordo@localhost:5432/ordo
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v6

      - name: Setup Node (o2switch version)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx --no-install prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrations on PostgreSQL 9.6
        working-directory: apps/api
        run: |
          npx --no-install prisma migrate deploy
          # The migrations must lead to the schema: no change left.
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Build
        run: npm run build
