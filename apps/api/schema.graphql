  """« Bénéficiaires »: relations the event is for."""
  beneficiaryRelationIds: [ID!]!
  calendarId: ID!

  """Cancelled, kept in the calendar."""
  calledOff: Boolean!
  categoryIds: [ID!]!
  contributorIds: [ID!]!
  description: String
  end: DateTime!
  endDate: String!
  endTime: String
  eventId: ID!
  key: String!
  label: String!

  """Documents of the library linked to the event (its whole series)."""
  libraryDocumentIds: [ID!]!
  links: [ItemLink!]!
  location: String
  locationLat: Float
  locationLon: Float
  modified: Boolean!
  occurrenceDate: String
  postponedFrom: CalendarPostponedFrom
  postponedTo: [CalendarPostponedTo!]!
  projectId: ID

  """
  Documents of projects linked to the event (its whole series), of its project tree.
  """
  projectResourceIds: [ID!]!
  recurrence: JSON

  """Relations without contributor taking part."""
  relationIds: [ID!]!

  """
  Minutes before its start or its end (all day: Paris midnight of its first day, or after its last day), a time of its first (or last) day, or that time 1 to 30 days before.
  """
  reminders: [Reminder!]!

  """Routines of a day of the occurrence it is about."""
  routineLinks: [EventRoutineLink!]!

  """Saved timers launched from the event (its whole series)."""
  savedCountdownIds: [ID!]!

  """
  Changed on its own: its fields as its series has them on its date (what « Toutes les occurrences » and « Celle-ci et les suivantes » edit); else null.
