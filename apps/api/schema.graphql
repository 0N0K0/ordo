  """Its name; null: « Minuteur »."""
  label: String
  linkLabel: String

  """Occurrence of that routine or recurring event."""
  occurrenceDate: Date

  """Page of the app its ring links to."""
  path: String

  """Seconds left while paused; null: running."""
  remainingSeconds: Int

  """Ringtone at its end; null: the one of the settings."""
  ringtone: String

  """Routine it was launched for."""
  routineId: String

  """Sheet it was launched for."""
  sheetId: String

  """Name of its item."""
