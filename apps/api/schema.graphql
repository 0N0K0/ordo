input ProjectCategoryInput {
  color: String!
  name: String!
}

input ProjectCategoryUpdateInput {
  color: String
  name: String
}

input ProjectInput {
  categoryIds: [ID!]

  """
  Client of a root project; a sub-project inherits the client of its parent.
  """
  clientId: ID
  color: String
  description: String
  endDate: Date
  icon: File
  parentId: ID
  startDate: Date
  statusId: ID
  title: String!
}

type ProjectResource {
  createdAt: DateTime!
  id: ID!
  kind: ProjectResourceKind!
  note: String
  projectId: ID!
  size: Int
  title: String!
  url: String!
}

enum ProjectResourceKind {
  FILE
  LINK
}

type ProjectStatus {
  color: String!
  id: ID!
  name: String!
  position: Int!
}

input ProjectStatusInput {
  color: String!
  name: String!
}

input ProjectStatusUpdateInput {
  color: String
  name: String
}

input ProjectUpdateInput {
  categoryIds: [ID!]

  """
  null detaches the project from its client; omitted leaves it unchanged.
  """
  clientId: ID
  color: String
  description: String
  endDate: Date

  """Replaces the current icon."""
  icon: File

  """null makes it a root project; omitted leaves it unchanged."""
  parentId: ID
  removeIcon: Boolean
  startDate: Date
  statusId: ID
  title: String
}

type Query {
  accountingDocument(id: ID!): AccountingDocument

  """
  Documents (recurring models excluded), latest first, optionally of a client or a project.
  """
  accountingDocuments(clientId: ID, projectId: ID): [AccountingDocument!]!
  alarms: [Alarm!]!
  calendarCategories: [CalendarCategory!]!

  """Occurrences of the events overlapping a period (dates included)."""
  calendarEvents(from: Date!, to: Date!): [CalendarEventOccurrence!]!

  """Calendars of other workspaces shown in this one (read only)."""
  calendarSubscriptions: [CalendarSubscription!]!

  """Calendars of the workspace, in their order."""
  calendars: [Calendar!]!

  """Catalogue, by title."""
  catalogItems: [CatalogItem!]!
  client(id: ID!): Client

  """Every client, archived ones included, in manual order."""
  clients: [Client!]!
  companyProfile: CompanyProfile!
  contributors: [Contributor!]!

  """
  Workspace the request works in (the one the app asks for, or the first one).
  """
  currentWorkspaceId: ID!

  """Dashboards of a project, or the global ones."""
  dashboards(projectId: ID): [Dashboard!]!
  documentFolders: [DocumentFolder!]!
  documentSequences(year: Int!): [DocumentSequence!]!
  documentStatuses: [DocumentStatus!]!

  """
  Forecasts (repeated ones once) and actual entries dated after today: the entries of the forecast.
  """
  forecastEntries: [TreasuryEntry!]!

  """
  Kinds of schedules of the other workspaces, with whether this one shows them.
  """
  foreignScheduleKinds: [ForeignScheduleKind!]!

  """Board of a URL with its fields, to configure a link."""
  githubBoard(url: String!): GithubBoard!
  githubContributors: [GithubContributor!]!

  """Login of the connected GitHub account, or null."""
  githubLogin: String
  githubProjectLink(projectId: ID!): GithubProjectLink
  health: String!

  """
  Imported quotes and invoices, latest first, optionally of a client or a project.
  """
  importedDocuments(clientId: ID, projectId: ID): [ImportedDocument!]!

  """Every document of the library (content of the files left out)."""
  libraryDocuments: [LibraryDocument!]!
  mailAccounts: [MailAccount!]!

  """
  A page of the mails matching criteria (shared mail search criteria), latest first; not saved.
  """
  mailAdvancedSearch(criteria: JSON!, page: Int!): MailSearchPage!

  """Opens a draft to go on writing it."""
  mailDraft(accountId: ID!, folder: String!, uid: Int!): MailDraft!
  mailFolders(accountId: ID!): [MailFolder!]!
  mailLabels: [MailLabel!]!

  """Opens a message (and marks it as read)."""
  mailMessage(accountId: ID!, folder: String!, uid: Int!): MailView!

  """
  A page of a folder, latest first (optionally the unread messages only).
  """
  mailMessages(
    accountId: ID!

    """Ascending order (descending by default)."""
    ascending: Boolean
    folder: String!
    page: Int!
    search: String

    """date (default), correspondent, subject or size."""
    sort: String

    """all (default), todo or done."""
    state: String
    unread: Boolean
  ): MailPage!

  """A page of the mails of a search folder, latest first."""
  mailSearchResults(id: ID!, page: Int!): MailSearchPage!
  mailSearches: [MailSearch!]!

  """Ids of the tasks matching a filter, in manual order."""
  matchingTaskIds(query: TaskQueryInput!): [ID!]!

  """
  For each sprint ended before the query day: ids of its tasks matching a filter whose status conditions (status, category, closed) use the status the tasks had at the end of the sprint.
  """
