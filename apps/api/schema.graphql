  """Ids of the tasks matching a filter, in manual order."""
  matchingTaskIds(query: TaskQueryInput!): [ID!]!
  me: User
  milestones: [Milestone!]!
  projectCategories: [ProjectCategory!]!

  """Mails linked to a project, latest first."""
