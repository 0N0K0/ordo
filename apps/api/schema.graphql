"""
Birthday of a contributor or a relation: a whole-day éphéméride derived from its birth date, every year, not stored.
"""
type Birthday {
  """
  Other ids (`relation:<id>`, `contributor:<id>`) naming the same birthday in the slot conditions: the relation linked to the contributor whose birthday applies, or the reverse.
  """
  aliases: [String!]!

  """
  Its person is archived (asked with `archived: true` only): shown nowhere, no moment to the slot conditions.
  """
  archived: Boolean!

  """
  Birth date: YYYY-MM-DD, or --MM-DD when the year is not known. Its birthday shows in the calendar (query birthdays).
  """
  birthDate: String!

  """Contributor it is of (also set for a relation that is a contributor)."""
  contributorId: ID

  """`contributor:<id>` or `relation:<id>`."""
  id: ID!
  name: String!

  """Relation it is of."""
  relationId: ID

  """Reminders « À HH:MM » or « N jours avant, à HH:MM » of the birthday."""
  reminders: [Reminder!]!
}

"""
Birthdays of the people of this workspace in its calendar, shown as all-day events: shown or not, and color (none: the gray of the éphémérides).
"""
type BirthdayLook {
  color: String

  """Shown in the calendar; hidden, their reminders still ring."""
  shown: Boolean!
}

input BirthdayLookInput {
  color: String
  shown: Boolean!
}

"""
A contributor or a relation of the workspace (archived ones too) as a slot condition names its birthday, with or without one.
"""
type BirthdayPersonName {
  archived: Boolean!

  """`contributor:<id>` or `relation:<id>`."""
  id: ID!
  name: String!
}

