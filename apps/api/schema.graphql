  addTaskComment(body: String!, taskId: ID!): TaskComment!
  addTaskRelation(otherId: ID!, taskId: ID!): Boolean!

  """
  Adds a member: an existing contributor, or a new contributor of this name.
  """
  addTreasuryMember(contributorId: ID, name: String): ID!

  """
  Attaches a list to the treasury entry paying it (adding its split by person), or detaches it (entryId null).
  """
  attachShoppingListEntry(entryId: ID, id: ID!): Boolean!

  """
  Deletes routines with their sub-routines, or alone (their sub-routines move up a level); returns how many of those given were deleted.
  """
  bulkDeleteRoutines(
    """false moves unselected sub-routines up."""
    deleteSubRoutines: Boolean!
    ids: [ID!]!
  ): Int!
  bulkDeleteTasks(
    """false moves unselected sub-tasks up."""
    deleteSubtasks: Boolean!
    ids: [ID!]!
  ): Boolean!

