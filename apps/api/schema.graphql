type Mutation {
  """blockerId blocks blockedId."""
  addTaskBlock(blockedId: ID!, blockerId: ID!): Boolean!
  addTaskComment(body: String!, taskId: ID!): TaskComment!
  addTaskRelation(otherId: ID!, taskId: ID!): Boolean!
  bulkDeleteTasks(
    """false moves unselected sub-tasks up."""
    deleteSubtasks: Boolean!
    ids: [ID!]!
  ): Boolean!
  bulkSetTasksArchived(archived: Boolean!, ids: [ID!]!): Boolean!

  """Moves the tasks and their sub-tasks to another project."""
  bulkTransferTasks(ids: [ID!]!, projectId: ID!): TaskTransferResult!
  bulkUpdateTasks(changes: BulkTaskInput!, ids: [ID!]!): Boolean!
  cancelEmailChange: User!

  """Closes every other session."""
  changePassword(currentPassword: String!, password: String!): Boolean!
  changeUsername(currentPassword: String!, username: String!): User!
  cloneTask(id: ID!, includeSubtasks: Boolean!): Task!

  """Works without a session: the link may be opened on another device."""
  confirmEmailChange(token: String!): Boolean!
  createAlarm(input: AlarmInput!): Alarm!
  createCalendarCategory(input: CalendarCategoryInput!): CalendarCategory!
  createCalendarEvent(input: CalendarEventInput!): ID!
  createClient(input: ClientInput!): Client!
  createClientContact(clientId: ID!, input: ClientContactInput!): ClientContact!
  createClientService(clientId: ID!, input: ClientServiceInput!): ClientService!
  createContributor(input: ContributorInput!): Contributor!
  createMailAccount(input: MailAccountInput!): MailAccount!
  createMilestone(input: MilestoneInput!): Milestone!
  createProject(input: ProjectInput!): Project!
  createProjectCategory(input: ProjectCategoryInput!): ProjectCategory!
  createProjectStatus(input: ProjectStatusInput!): ProjectStatus!
  createTask(input: TaskInput!): Task!
  createTaskPriority(input: TaskLabelInput!): TaskPriority!
  createTaskStatus(input: TaskLabelInput!): TaskStatus!
  createTaskType(input: TaskLabelInput!): TaskType!
  createTaskView(input: TaskViewInput!): TaskView!
  createTimeEntry(input: TimeEntryInput!): TimeEntry!
  deleteAlarm(id: ID!): Boolean!
  deleteCalendarCategory(id: ID!): Boolean!
  deleteCalendarEvent(id: ID!, occurrenceDate: Date, scope: CalendarEventScope!): Boolean!
  deleteClient(
    """true deletes the projects, false moves them to "no client"."""
    deleteProjects: Boolean!
    id: ID!
  ): Boolean!
  deleteClientContact(id: ID!): Boolean!
  deleteClientService(id: ID!): Boolean!
  deleteContributor(id: ID!): Boolean!
  deleteMailAccount(id: ID!): Boolean!

  """Deletes a draft for good."""
  deleteMailDraft(location: MailLocationInput!): Boolean!

  """Moves mails to the trash (deletes them for good from the trash)."""
  deleteMails(accountId: ID!, folder: String!, uids: [Int!]!): Boolean!
  deleteMilestone(id: ID!): Boolean!

  """Deletes the project and all its sub-projects."""
  deleteProject(id: ID!): Boolean!
  deleteProjectCategory(id: ID!): Boolean!
  deleteProjectStatus(id: ID!): Boolean!
  deleteTask(
    """false moves the sub-tasks up to the parent."""
    deleteSubtasks: Boolean!
    id: ID!
  ): Boolean!
  deleteTaskComment(id: ID!): Boolean!
  deleteTaskPriority(id: ID!): Boolean!
  deleteTaskStatus(id: ID!): Boolean!
  deleteTaskType(id: ID!): Boolean!
  deleteTaskView(id: ID!): Boolean!
  deleteTimeEntry(id: ID!): Boolean!
  duplicateTaskView(id: ID!, name: String!): TaskView!

  """Links a mail to a project (a copy is kept in Ordo)."""
  linkMail(accountId: ID!, folder: String!, projectId: ID!, uid: Int!): LinkedMail!

  """Opens a session with a username or email and a password."""
  login(identifier: String!, password: String!): User!
  logout: Boolean!

  """Records that an alarm rang for the occurrence at `at`."""
  markAlarmFired(at: DateTime!, id: ID!): Boolean!

  """
  Creates the occurrences of recurring tasks falling in a displayed period; returns how many were created.
  """
  materializeTaskOccurrences(from: Date!, to: Date!): Int!
  moveCalendarCategory(id: ID!, index: Int!): Boolean!
  moveClient(id: ID!, index: Int!): Boolean!
  moveMailAccount(id: ID!, index: Int!): Boolean!
  moveMilestone(id: ID!, index: Int!): Boolean!

  """Moves a project with its sub-projects."""
  moveProject(
    """
    Client of a root project, null for "no client" (ignored with a parent).
    """
    clientId: ID
    id: ID!
    index: Int!

    """Target parent project, null for a root project."""
    parentId: ID
  ): Boolean!
  moveProjectStatus(id: ID!, index: Int!): Boolean!

  """
  Places a task before another one in the manual order (at the end when beforeId is null), and under parentId when given (null: top-level task; omitted: parent unchanged).
  """
  moveTask(beforeId: ID, id: ID!, parentId: ID): Boolean!
  moveTaskPriority(id: ID!, index: Int!): Boolean!
  moveTaskStatus(id: ID!, index: Int!): Boolean!
  moveTaskType(id: ID!, index: Int!): Boolean!
  moveTaskView(id: ID!, index: Int!): Boolean!
  removeTaskBlock(blockedId: ID!, blockerId: ID!): Boolean!
  removeTaskRelation(otherId: ID!, taskId: ID!): Boolean!

  """
  Sends a confirmation link to the new address; the email changes once confirmed.
  """
  requestEmailChange(currentPassword: String!, email: String!): User!

  """Always returns true, whether or not the account exists."""
  requestPasswordReset(identifier: String!): Boolean!
  resetPassword(password: String!, token: String!): Boolean!

  """
  Saves a draft in the drafts folder of its account, replacing its previous version.
  """
  saveMailDraft(input: SaveMailDraftInput!): SavedMailDraft!

  """Sends a mail; returns the projects it was linked to."""
  sendMail(input: SendMailInput!): [ID!]!

  """Archiving cascades to the active projects; restoring brings them back."""
  setClientArchived(archived: Boolean!, id: ID!): Client!
  setClientFavorite(favorite: Boolean!, id: ID!): Client!

  """Sets (PNG or JPEG) or removes (null) the logo."""
  setCompanyLogo(file: File): CompanyProfile!
  setDefaultTaskView(id: ID!): Boolean!

  """Sets the number the next final document of a type gets in a year."""
  setDocumentSequence(nextNumber: Int!, type: AccountingDocumentType!, year: Int!): Boolean!
  setMailSeen(accountId: ID!, folder: String!, seen: Boolean!, uids: [Int!]!): Boolean!
  setMailSignature(id: ID!, signature: String!): MailAccount!

  """
  Archiving cascades to sub-projects; restoring a project restores its archived ancestors and client.
  """
  setProjectArchived(archived: Boolean!, id: ID!): Project!

  """
  Sets the contributors directly attached to a project; tasks keep their assignees.
  """
  setProjectContributors(contributorIds: [ID!]!, projectId: ID!): Boolean!
  setProjectFavorite(favorite: Boolean!, id: ID!): Project!

  """
  Archiving cascades to sub-tasks; restoring restores them and the archived parents.
  """
  setTaskArchived(archived: Boolean!, id: ID!): Task!

  """
  Makes a task recurring, changes its repetition, or stops it (null). On an occurrence, its series is changed.
  """
  setTaskRecurrence(id: ID!, recurrence: JSON): Task!

  """
  Closes (done) or reopens tasks; a closed task no longer blocks other tasks.
  """
  setTasksClosed(closed: Boolean!, ids: [ID!]!): Boolean!
  setTimerPaused(paused: Boolean!): TimeEntry!

  """Starts a timer; the running one is stopped first."""
  startTimer(input: TimerInput!): TimeEntry!
  stopTimer: TimeEntry

  """
  Connects to the IMAP and SMTP servers; empty passwords use those saved for `id`.
  """
  testMailAccount(id: ID, input: MailAccountInput!): Boolean!

  """Moves the task and its sub-tasks to another project."""
  transferTask(id: ID!, projectId: ID!): TaskTransferResult!
  unlinkMail(id: ID!): Boolean!
  updateAlarm(id: ID!, input: AlarmInput!): Alarm!
  updateCalendarCategory(id: ID!, input: CalendarCategoryInput!): CalendarCategory!

  """
  Changes an event; for a recurring one, the occurrence, it and the following ones, or the whole series.
  """
  updateCalendarEvent(id: ID!, input: CalendarEventInput!, occurrenceDate: Date, scope: CalendarEventScope!): ID!
  updateClient(id: ID!, input: ClientUpdateInput!): Client!
  updateClientContact(id: ID!, input: ClientContactInput!): ClientContact!
  updateClientDetails(id: ID!, input: ClientDetailsInput!): Client!
  updateClientService(id: ID!, input: ClientServiceInput!): ClientService!
  updateCompanyProfile(input: CompanyProfileInput!): CompanyProfile!
  updateContributor(id: ID!, input: ContributorUpdateInput!): Contributor!
  updateMailAccount(id: ID!, input: MailAccountInput!): MailAccount!
  updateMilestone(id: ID!, input: MilestoneUpdateInput!): Milestone!
  updateProject(id: ID!, input: ProjectUpdateInput!): Project!
  updateProjectCategory(id: ID!, input: ProjectCategoryUpdateInput!): ProjectCategory!
  updateProjectStatus(id: ID!, input: ProjectStatusUpdateInput!): ProjectStatus!
  updateTask(id: ID!, input: TaskUpdateInput!): Task!
  updateTaskComment(body: String!, id: ID!): TaskComment!
  updateTaskPriority(id: ID!, input: TaskLabelUpdateInput!): TaskPriority!
  updateTaskStatus(id: ID!, input: TaskLabelUpdateInput!): TaskStatus!
  updateTaskType(id: ID!, input: TaskLabelUpdateInput!): TaskType!
  updateTaskView(id: ID!, input: TaskViewUpdateInput!): TaskView!
  updateTimeEntry(id: ID!, input: TimeEntryUpdateInput!): TimeEntry!

  """Stores a file to link from a markdown text (10 MB maximum)."""
  uploadAttachment(file: File!): Attachment!
}

