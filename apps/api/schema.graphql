  Archiving cascades to sub-routines; restoring restores those archived along and the archived parents. Returns how many of those given changed.
  """
  bulkSetRoutinesArchived(archived: Boolean!, ids: [ID!]!): Int!

  """
  Ticks or unticks the current occurrence of several routines; returns how many changed.
  """
  bulkSetRoutinesDone(done: Boolean!, ids: [ID!]!): Int!

  """
  Archiving cascades to sub-tasks; restoring restores them and the archived parents.
  """
  bulkSetTasksArchived(archived: Boolean!, ids: [ID!]!): Boolean!

  """
  Moves the tasks and their sub-tasks to another project, or out of any (projectId null).
