type Query {
  """Every client, archived ones included, in manual order."""
  clients: [Client!]!
  contributors: [Contributor!]!
  health: String!

  """Ids of the tasks matching a filter, in manual order."""
  matchingTaskIds(query: TaskQueryInput!): [ID!]!
  me: User
  milestones: [Milestone!]!
  projectCategories: [ProjectCategory!]!
  projectStatuses: [ProjectStatus!]!

  """Every project, archived ones included, in manual order."""
  projects: [Project!]!
  task(number: Int!): Task
  taskPriorities: [TaskPriority!]!
  taskStatuses: [TaskStatus!]!
  taskTypes: [TaskType!]!

  """
  Views of a project's task tab, or of the home page when projectId is omitted.
  """
  taskViews(projectId: ID): [TaskView!]!

  """Every task, archived ones included, in manual order."""
  tasks: [Task!]!
}

