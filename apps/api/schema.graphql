  Without kind: an éphéméride, not a créneau (with one: that of its kind).
  """
  ephemeris: Boolean

  """Exceptions: { from, to, label, cases }."""
  exceptions: JSON!
  label: String!

  """Reminders of an éphéméride, 10 at most; omitted: left unchanged."""
  reminders: [ReminderInput!]
  startDate: Date!

  """
  Kind of time it plans; none: working hours (or, an éphéméride, no kind).
  """
  typeId: ID

  """
  Without kind: « Indisponible », nothing is scheduled during its slots (with one: that of its kind).
  """
  unavailable: Boolean
}

type Workspace {
  id: ID!
  kind: WorkspaceKind!
  label: String!

  """Notifications it still gives while another workspace is open."""
  notifyElsewhere: [NotificationSource!]!
  position: Int!

  """
  Last day of its weeks, included; the first one: weeks of 8 days, overlapping.
  """
  weekEnd: Int!

  """First day of its weeks, 1 (Monday) to 7 (Sunday)."""
  weekStart: Int!
}

input WorkspaceInput {
  kind: WorkspaceKind!
  label: String!
}

"""Professional (invoicing, clients, company) or personal workspace."""
enum WorkspaceKind {
  PERSO
  PRO
}