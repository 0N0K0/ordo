  documents: [TreasuryEntryDocument!]!
  id: ID!
  label: String!

  """Split of the amount; what the lines leave is "not split"."""
  lines: [TreasuryEntryLine!]!

  """Lines of other entries linked to this whole entry."""
  linkedByLines: [TreasuryLinkedLine!]!
  linkedEntries: [TreasuryLinkedEntry!]!
  methodId: ID
  methodLabel: String
  note: String

  """Payer or payee: the client or the counterparty."""
