"""
Reminder of a task, a routine, an event, an éphéméride or a birthday: minutes before a moment (0: at the start), or a time of the day of its day or of `days` days before it (Paris time). One of before and at is null.
"""
type Reminder {
  """
  `start` (counted from the start of the item, its first day; a routine: the start of the opening day of an occurrence) or `end` (from its end, its last day; a routine: the end of its due day); routines only: `openEnd` (the end of the opening day), `dueStart` (the start of the due day).
  """
  anchor: String!

  """HH:MM on the day of the item, or `days` days before it (Paris time)."""
  at: String

  """Minutes before, 0 to 1 440 (events, routines, éphémérides)."""
  before: Int

  """
  Days before the day of the item, 1 to 30, with `at` (« N jours avant, à HH:MM »); null: its day.
  """
  days: Int

  """Ringtone of the bank; null: the one of the settings of the user."""
  ringtone: String
}

input ReminderInput {
  """
  `start` (default) or `end` (events and routines); `openEnd`, `dueStart` (routines).
  """
  anchor: String

  """HH:MM."""
  at: String

  """Minutes before, 0 to 1 440."""
  before: Int

  """Days before, 1 to 30, with `at`."""
  days: Int

  """Ringtone of the bank; none: the one of the settings."""
  ringtone: String
}

