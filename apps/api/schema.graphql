  loan: Boolean!
  memberId: ID
  mode: TreasuryLineMode!
  projectId: ID

  """Relation it is for, instead of a member."""
  relationId: ID

  """Signed amount, or signed percentage of the entry amount."""
  value: Float!
}

input TreasuryEntryLineInput {
  categoryId: ID
  contextId: ID
  date: Date

  """Line kept (its links from other entries stay); none for a new line."""
