"""Kind of notification a workspace can give while another one is open."""
enum NotificationSource {
  MAILS
}

"""
Saved place ("Maison", "Bureau"…): an address and its point; or a zone of one (a room of the house), with its point.
"""
type Place {
  """Its address, or that of the place a zone is in."""
  address: String!
  archived: Boolean!
  color: String

  """Image shown as its avatar (none: its initials on its color)."""
  iconUrl: String
  id: ID!
  label: String!
  lat: Float!
  lon: Float!

  """Place a zone is in; null: a place with its own address."""
  parentId: ID

  """Full label (« Maison › Cuisine »)."""
  path: String!
  position: Int!
}

input PlaceInput {
  address: String
  label: String!

  """None for a zone."""
  lat: Float

  """None for a zone."""
  lon: Float

  """Place a zone is in."""
  parentId: ID
}

type ProductStock {
  productId: ID!
  quantity: Float!
}

input ProductStockInput {
  autoStock: Boolean!
  consumable: Boolean!
  stockLocationId: ID
  stockTracked: Boolean!
}

type Project {
  """Archived: hidden by default, read only."""
  archived: Boolean!
  categories: [ProjectCategory!]!
  clientId: ID
  color: String
  description: String
  endDate: Date
  favorite: Boolean!
  iconUrl: String
  id: ID!
  label: String!
  parentId: ID
  position: Int!
  startDate: Date
  statusId: ID
}

type ProjectCategory {
  """Archived: hidden by default, read only."""
  archived: Boolean!
  color: String!

  """Image shown as its avatar (none: its initials on its color)."""
  iconUrl: String
  id: ID!
  label: String!
  position: Int!
}

input ProjectInput {
  categoryIds: [ID!]

  """
  Client of a root project; a sub-project inherits the client of its parent.
  """
  clientId: ID
  color: String
  description: String
  endDate: Date
  icon: File
  label: String!
  parentId: ID
  startDate: Date
  statusId: ID
}

type ProjectResource {
  createdAt: DateTime!
  id: ID!
  kind: ProjectResourceKind!
  label: String!
  note: String
  projectId: ID!
  size: Int
  url: String!
}

enum ProjectResourceKind {
  FILE
  LINK
}

type ProjectStatus {
  """Archived: hidden by default, read only."""
  archived: Boolean!
  color: String!

  """Image shown as its avatar (none: its initials on its color)."""
  iconUrl: String
  id: ID!
  label: String!
  position: Int!
}

input ProjectUpdateInput {
  categoryIds: [ID!]

  """
  null detaches the project from its client; omitted leaves it unchanged.
  """
  clientId: ID
  color: String
  description: String
  endDate: Date

  """Replaces the current icon."""
  icon: File
  label: String

  """null makes it a root project; omitted leaves it unchanged."""
  parentId: ID
  removeIcon: Boolean
  startDate: Date
  statusId: ID
}

type Query {
  accountingDocument(id: ID!): AccountingDocument

  """
  Documents (recurring models excluded), latest first, optionally of a client or a project.
  """
  accountingDocuments(clientId: ID, projectId: ID): [AccountingDocument!]!
  alarms: [Alarm!]!
  calendarCategories: [CalendarCategory!]!

  """Occurrences of the events overlapping a period (dates included)."""
  calendarEvents(from: Date!, to: Date!): [CalendarEventOccurrence!]!

  """Calendars of other workspaces shown in this one (read only)."""
  calendarSubscriptions: [CalendarSubscription!]!

  """Calendars of the workspace, in their order."""
  calendars: [Calendar!]!

  """Catalogue, by label."""
  catalogItems: [CatalogItem!]!

  """
  Checklist of a routine or an event occurrence, or of a task: made of its sheets the first time it is asked (none without sheets).
  """
  checklist(eventId: ID, occurrenceDate: Date, routineId: ID, taskId: ID): Checklist
  client(id: ID!): Client

  """Every client, archived ones included, in manual order."""
  clients: [Client!]!

  """
  Number of comments of items of a kind (descriptions not counted); of occurrences for routines and events.
  """
  commentCounts(
    """
    Items; for routines and events, occurrence keys (« id|YYYY-MM-DD », the id alone for a one-off event).
    """
    ids: [String!]!
    target: CommentTarget!
  ): [CommentCount!]!

  """
  Comments of an item, oldest first; of one occurrence for a routine or an event (decision D19).
  """
  comments(
    """Item id (Message-ID for a mail)."""
    id: String!

    """Occurrence of a routine or a recurring event (none: a one-off event)."""
    occurrenceDate: Date
    target: CommentTarget!
  ): [Comment!]!
  companyProfile: CompanyProfile!
  contributors: [Contributor!]!

  """
  Workspace the request works in (the one the app asks for, or the first one).
  """
  currentWorkspaceId: ID!

  """Dashboards of a project, or the global ones."""
  dashboards(projectId: ID): [Dashboard!]!

  """
  Final deposit invoices of a client not deducted in full yet (the deductions of `documentId` left out).
  """
  deductibleDeposits(clientId: ID!, documentId: ID): [DeductibleDeposit!]!

  """Schedules without kind of this workspace: name, color and display."""
  defaultScheduleKind: DefaultScheduleKind!

  """
  Ids of the open tasks that can be done now: allowed by their slot rule (else the default of the workspace) and kept by no event of their people.
  """
  doableTaskIds(utcOffset: Int!): [ID!]!
  documentFolders: [DocumentFolder!]!
  documentSequences(year: Int!): [DocumentSequence!]!
  documentStatuses: [DocumentStatus!]!

  """
  Forecasts (repeated ones once) and actual entries dated after today: the entries of the forecast.
  """
  forecastEntries: [TreasuryEntry!]!

  """
  Kinds of schedules of the other workspaces, with whether this one shows them.
  """
  foreignScheduleKinds: [ForeignScheduleKind!]!

  """Board of a URL with its fields, to configure a link."""
  githubBoard(url: String!): GithubBoard!
  githubContributors: [GithubContributor!]!

  """Login of the connected GitHub account, or null."""
  githubLogin: String
  githubProjectLink(projectId: ID!): GithubProjectLink
  health: String!
  importedDocument(id: ID!): ImportedDocument

  """
