type AccountingDocument {
  acceptedAt: Date
  attachments: [AccountingAttachment!]!

  """
  Final invoices: still due by the client; credit notes: still owed to the client.
  """
  balance: Float

  """
  Address the document is mailed to: its contact, else its service, else its client.
  """
  billingEmail: String
  billingSchedule: String
  buyer: JSON
  clientId: ID!
  clientName: String!
  conclusion: String
  contactId: ID

  """Final invoices: deducted by credit notes."""
  credited: Float
  currency: String!
  depositType: DiscountType
  depositValue: Float
  derived: [AccountingDocument!]!
  dueDate: Date
  finalizedAt: DateTime
  globalDiscountType: DiscountType
  globalDiscountValue: Float
  id: ID!

  """Imported quote a deposit invoice was made from."""
  importedSourceId: ID
  importedSourceNumber: String
  introduction: String

  """
  Quotes: amount excluding VAT already invoiced on it (final invoices minus credit notes).
  """
  invoicedNet: Float
  issueDate: Date!
  lastReminderAt: DateTime
  lateInterest: String
  lines: [AccountingLine!]!
  number: String
  otherMentions: String

  """
  Final invoice still due after its due date, or quote waiting after its validity.
  """
  overdue: Boolean!

  """Final invoices: paid by the client; credit notes: refunded."""
  paid: Float
  paymentMethods: String
  paymentTerms: String
  payments: [TreasuryAllocation!]!
  projectId: ID
  recurringId: ID
  referenceLabel: String
  referenceValue: String
  reminderCount: Int!
  reminders: [DocumentReminder!]!
  seller: JSON
  sentAt: DateTime
  serviceEnd: Date
  serviceId: ID
  serviceStart: Date
  showBankDetails: Boolean!
  signedFileName: String
  signedFileUrl: String
  sourceId: ID
  sourceNumber: String
  status: AccountingDocumentStatus!

  """Tracked time billed on the document."""
  timeEntries: [TimeEntry!]!
  title: String
  totalGross: Float!
  totalNet: Float!
  totalVat: Float!
  trackingStatus: DocumentStatus
  type: AccountingDocumentType!
  updatedAt: DateTime!
  vatApplicable: Boolean!
  vatExemptionText: String
}

input AccountingDocumentInput {
  billingSchedule: String
