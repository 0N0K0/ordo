  """Minutes."""
  estimate: Int

  """First occurrence of the routine (from its start)."""
  firstDate: Date

  """Time to do it from (HH:MM), its own (see windowFrom)."""
  fromTime: String
  id: ID!

  """
  State (inherited, own, emptied on purpose) and source of each inherited field.
  """
  inheritance: [FieldOrigin!]!

  """Fields it takes from its parent, live; none for a top-level routine."""
  inheritedFields: [RoutineInheritableField!]!
  label: String!
  lastDoneAt: DateTime

  """Documents of the library linked to it (not inherited)."""
  libraryDocumentIds: [ID!]!

  """Links, as those of the events."""
  links: [ItemLink!]!
  location: String
  locationLat: Float
  locationLon: Float

  """
  Times of the day following its rule or its schedules, [{ fromTime, dueTime, optional }].
  """
  moments: JSON!

  """
  Exceptions: occurrences moved to another day, deleted (to null) or with other times, [{ from, to, times, apart?, merged?, mergedRows?, previous? }] (YYYY-MM-DD), by day of the rule; apart: moved onto a day that has its own and kept apart (identified by from); merged: merged into the occurrence of that day (no longer one of its own; mergedRows: the rows it brought); previous: cancelled or merged, the exception it had before, given back when that is undone.
  """
  moves: JSON!

  """First occurrence after today, by the day that identifies it."""
  nextDate: Date

  """Due day of the next occurrence (nextDate unless moved and kept apart)."""
  nextDueDate: Date

  """
  « Ouverture » of the occurrences of its rule: { mode: DAY | WEEKDAY | WEEK | BEFORE, … }; null: from their first day.
  """
  opensOn: JSON
  parentId: ID

  """Global manual order of every routine (not among siblings)."""
  position: Int!

  """Priority, from the list of the tasks (its own: see effective)."""
  priorityId: ID
  projectId: ID

  """
  Documents of projects linked to it, of its project tree (not inherited).
  """
  projectResourceIds: [ID!]!

  """
  Rule of its repetition (every day for one saved following calendar schedules).
  """
  recurrence: JSON!

  """« Relative à »: routines related to this one (both ways)."""
  relatedIds: [ID!]!

  """
  Occurrences its reminders ring for: its current one while not done and its next one, and those opening within the days of its reminders « N jours avant ».
  """
  reminderOccurrences: [RoutineReminderOccurrence!]!

  """
  Reminders: minutes (24 hours at most) before the start or the end of each time of the day on the first day (« Ouverture ») or the due day of an occurrence (`anchor`), or a time of one of those days or of some days before it.
  """
  reminders: [Reminder!]!

  """Routines to do before this one."""
  requiredIds: [ID!]!

  """Saved timers launched from it."""
  savedCountdownIds: [ID!]!

  """
  Following its rule: on or out of calendar schedules, in groups combined with and / or (the filters of the tables); null: any time.
  """
  slotCondition: JSON

  """
  Times of the day of its current occurrence (its next one before it starts), with those ticked.
  """
  slots: [RoutineSlot!]!
  startDate: Date!

  """
  Time tracked on it, finished entries only; a time on several routines is shared equally between them.
  """
  trackedSeconds: Int!

  """Travel time back, in minutes."""
  travelAfter: Int!

  """Travel time there, in minutes."""
  travelBefore: Int!

  """Type, from the list of the tasks."""
  typeId: ID

  """
  Time to do it from on its current (or next) occurrence, for its time of the day to come: its own, its case’s or its schedule’s.
  """
  windowFrom: String

  """
  Latest time to do it by on its current (or next) occurrence, for its time of the day to come.
  """
