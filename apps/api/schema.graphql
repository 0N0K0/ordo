input BulkTaskInput {
  addAssigneeIds: [ID!]
  effort: Float
  endDate: Date
  milestoneId: ID
  priorityId: ID
  removeAssigneeIds: [ID!]
  startDate: Date
  statusId: ID
  typeId: ID
}

type Client {
