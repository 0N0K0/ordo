  bulkTransferTasks(ids: [ID!]!, projectId: ID): RemovedLinksResult!

  """
  Applies the same changes to several routines; those moved to another project tree lose their links out of it (told back).
  """
  bulkUpdateRoutines(
    changes: RoutineBulkChanges!

    """
    Occurrences made to disappear with their comments or times are confirmed: false (default) refuses with CONFIRMATION_REQUIRED and extension lost { times, comments } when there are some; true deletes them.
    """
    confirmLoss: Boolean
    ids: [ID!]!
  ): RemovedLinksResult!
  bulkUpdateTasks(
    changes: BulkTaskInput!
    ids: [ID!]!

    """
