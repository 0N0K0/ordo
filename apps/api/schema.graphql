  Adds a sheet (times a multiplier) to a shopping list, summed with its items; returns the number of items of the sheet.
  """
  addSheetToShoppingList(listId: ID!, multiplier: Float!, sheetId: ID!): Int!

  """Adds an item of this list only (not from a base list) to a list."""
  addShoppingItem(input: ShoppingItemInput!, listId: ID!): ID!

  """
  Adds products of base lists to a list (those already in it are left out); returns the number added.
  """
  addShoppingProducts(listId: ID!, productIds: [ID!]!): Int!

